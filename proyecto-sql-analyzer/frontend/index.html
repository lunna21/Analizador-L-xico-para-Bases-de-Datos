<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador SQL - Base de Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-database-fill"></i> 
                Analizador SQL
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-6">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-code-square me-2"></i>Editor de consultas</h5>
                        <button id="btn-execute" class="btn btn-success btn-sm">
                            <i class="bi bi-play-fill me-1"></i>Ejecutar
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <select id="query-template" class="form-select mb-3">
                                <option value="">-- Seleccionar plantilla --</option>
                                <option value="insert-usuarios">Insertar usuario</option>
                                <option value="insert-productos">Insertar producto</option>
                                <option value="insert-pedidos">Insertar pedido</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <textarea id="sql-editor" class="form-control code-editor" rows="10" placeholder="Escribe tu consulta SQL aquí..."></textarea>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4 shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-table me-2"></i>Constructor de consultas</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="table-select" class="form-label">Tabla:</label>
                            <select id="table-select" class="form-select">
                                <option value="usuarios">usuarios</option>
                                <option value="productos">productos</option>
                                <option value="pedidos">pedidos</option>
                            </select>
                        </div>
                        <div id="fields-container">
                            <!-- Aquí se cargarán los campos según la tabla seleccionada -->
                        </div>
                        <button id="btn-generate" class="btn btn-primary mt-2">
                            <i class="bi bi-lightning-fill me-1"></i>Generar consulta
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-braces me-2"></i>Análisis léxico</h5>
                    </div>
                    <div class="card-body">
                        <div id="lexical-analysis" class="p-3 bg-light rounded code-output">
                            <!-- Aquí se mostrará el análisis léxico -->
                            <p class="text-muted">El análisis léxico aparecerá aquí cuando ejecutes una consulta...</p>
                        </div>
                    </div>
                </div>

                <div class="card mb-4 shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-check-circle me-2"></i>Resultado</h5>
                    </div>
                    <div class="card-body">
                        <div id="query-result" class="p-3 bg-light rounded code-output">
                            <!-- Aquí se mostrará el resultado de la consulta -->
                            <p class="text-muted">Los resultados aparecerán aquí cuando ejecutes una consulta...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">Analizador Léxico para Bases de Datos</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
